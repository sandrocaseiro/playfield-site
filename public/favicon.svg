<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 26 460 460" width="460" height="460" role="img" aria-labelledby="t">
<title id="t">Playfield</title>
<!-- Origin. Free-standing on transparency: the source for every app icon.

     Six 2:3 covers on a 140 circle, each lapping the next by 16 and cut by it;
     the opening is 88 across. Seams are cut rather than painted, so the mark
     owns no ground.

     Each blade sits in a <g> carrying no transform. The masks are
     maskUnits="userSpaceOnUse" and resolve where they are referenced, so a
     transform on the wrapper moves the cutters and blades erase each other. -->
<defs>
<linearGradient id="a" x1=".05" y1="0" x2=".95" y2="1"><stop offset="0" stop-color="#f7d49c"/><stop offset="1" stop-color="#e0a458"/></linearGradient>
<linearGradient id="b" x1=".05" y1="0" x2=".95" y2="1"><stop offset="0" stop-color="#e0a458"/><stop offset="1" stop-color="#b07c38"/></linearGradient>
<linearGradient id="c" x1=".05" y1="0" x2=".95" y2="1"><stop offset="0" stop-color="#b07c38"/><stop offset="1" stop-color="#74531f"/></linearGradient>
<linearGradient id="d" x1=".05" y1="0" x2=".95" y2="1"><stop offset="0" stop-color="#e0a458"/><stop offset="1" stop-color="#74531f"/></linearGradient>
<mask id="m0" maskUnits="userSpaceOnUse" x="-40" y="-40" width="592" height="592"><rect x="-40" y="-40" width="592" height="592" fill="#fff"/><rect x="169" y="55" width="174" height="122" rx="22" transform="rotate(60 256 256)" fill="#000"/></mask>
<mask id="m1" maskUnits="userSpaceOnUse" x="-40" y="-40" width="592" height="592"><rect x="-40" y="-40" width="592" height="592" fill="#fff"/><rect x="169" y="55" width="174" height="122" rx="22" transform="rotate(120 256 256)" fill="#000"/></mask>
<mask id="m2" maskUnits="userSpaceOnUse" x="-40" y="-40" width="592" height="592"><rect x="-40" y="-40" width="592" height="592" fill="#fff"/><rect x="169" y="55" width="174" height="122" rx="22" transform="rotate(180 256 256)" fill="#000"/></mask>
<mask id="m3" maskUnits="userSpaceOnUse" x="-40" y="-40" width="592" height="592"><rect x="-40" y="-40" width="592" height="592" fill="#fff"/><rect x="169" y="55" width="174" height="122" rx="22" transform="rotate(240 256 256)" fill="#000"/></mask>
<mask id="m4" maskUnits="userSpaceOnUse" x="-40" y="-40" width="592" height="592"><rect x="-40" y="-40" width="592" height="592" fill="#fff"/><rect x="169" y="55" width="174" height="122" rx="22" transform="rotate(300 256 256)" fill="#000"/></mask>
<mask id="m5" maskUnits="userSpaceOnUse" x="-40" y="-40" width="592" height="592"><rect x="-40" y="-40" width="592" height="592" fill="#fff"/><rect x="169" y="55" width="174" height="122" rx="22" transform="rotate(0 256 256)" fill="#000"/></mask>
</defs>
<g mask="url(#m0)"><rect x="178" y="64" width="156" height="104" rx="13" transform="rotate(0 256 256)" fill="url(#a)"/></g>
<g mask="url(#m1)"><rect x="178" y="64" width="156" height="104" rx="13" transform="rotate(60 256 256)" fill="url(#b)"/></g>
<g mask="url(#m2)"><rect x="178" y="64" width="156" height="104" rx="13" transform="rotate(120 256 256)" fill="url(#c)"/></g>
<g mask="url(#m3)"><rect x="178" y="64" width="156" height="104" rx="13" transform="rotate(180 256 256)" fill="url(#d)"/></g>
<g mask="url(#m4)"><rect x="178" y="64" width="156" height="104" rx="13" transform="rotate(240 256 256)" fill="url(#b)"/></g>
<g mask="url(#m5)"><rect x="178" y="64" width="156" height="104" rx="13" transform="rotate(300 256 256)" fill="url(#c)"/></g>
</svg>
