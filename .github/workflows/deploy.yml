name: Deploy

# The site reads its releases from this repository's own Releases at build
# time, so it has to rebuild whenever a release appears or is edited — not only
# when someone pushes to the site itself. Editing a release body on GitHub is
# how a changelog gets corrected, and this is what makes that reach the page.

on:
  push:
    branches: [main]
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The token is only here to raise the API rate limit — the releases it
      # reads are public. A build with no token still works and still deploys;
      # it just has fewer requests to spend.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
